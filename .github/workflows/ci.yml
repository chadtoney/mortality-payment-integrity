name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/MortalityReview.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/MortalityReview.Web
        run: npm ci

      - name: Lint frontend
        working-directory: src/MortalityReview.Web
        run: npm run lint

      - name: Build frontend
        working-directory: src/MortalityReview.Web
        run: npm run build

      - name: Test .NET solution
        run: dotnet test MortalityReview.slnx --configuration Release

      - name: Build combined deployment artifact
        run: dotnet publish src/MortalityReview.Api/MortalityReview.Api.csproj --configuration Release --output .artifacts/publish